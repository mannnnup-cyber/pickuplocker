apply plugin: 'com.android.application'

android {
    namespace "com.pickupjamaica.kiosk"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.pickupjamaica.kiosk"
        minSdk rootProject.ext.minSdkVersion      // 22 = Android 5.1
        targetSdk rootProject.ext.targetSdkVersion // 29 = Android 10 (same as working Capacitor APK)
        versionCode 3
        versionName "2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    // Enable BuildConfig generation
    buildFeatures {
        buildConfig true
    }

    // Java 11 compatibility
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Suppress lint warnings for WebView
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Minimal dependencies — just appcompat for Theme.AppCompat
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
}
